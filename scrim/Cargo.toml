[package]
name = "scrim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal headless browser for AI agents: QuickJS + a JS DOM, no layout, no paint"

[[bin]]
name = "scrim"
path = "src/main.rs"


[dependencies]
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
rquickjs = { version = "0.9", features = ["loader"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }
url = "2.5.8"
v8 = "=150.4.0"
# Screenshots (render.rs): Blitz paints the DOM scrim serializes. Pinned to one Blitz commit and the
# anyrender commit that Blitz pins, so their types match.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "84dec072bd3c6657ad0950372ffc1dff5c9d82e9", default-features = false, features = ["svg", "woff", "floats"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "84dec072bd3c6657ad0950372ffc1dff5c9d82e9", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "84dec072bd3c6657ad0950372ffc1dff5c9d82e9", default-features = false, features = ["svg"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "84dec072bd3c6657ad0950372ffc1dff5c9d82e9", default-features = false }
anyrender = { git = "https://github.com/DioxusLabs/anyrender", rev = "1a314052b7b19cc510606d2d3c6145cf8b9a8a84" }
anyrender_vello_cpu = { git = "https://github.com/DioxusLabs/anyrender", rev = "1a314052b7b19cc510606d2d3c6145cf8b9a8a84" }
peniko = "0.6.0"
png = "0.18"
# The same fontique/parley Blitz uses, to hand it a prepared font collection (fonts.rs).
fontique = { version = "0.13", default-features = false, features = ["std"] }
parley = { version = "0.13", default-features = false, features = ["std"] }
data-url = "0.3"

[build-dependencies]
rquickjs = { version = "0.9" }
v8 = "=150.4.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Screenshot-only code (render.rs) runs once per capture: optimize it for size so the binary stays
# small ("s" for style, layout, shaping and raster; "z" for image decoders, SVG, ICU data and font
# discovery, which barely affect capture time). Reading pages (V8, QuickJS, html5ever, scrim
# itself) keeps opt-level 3.
[profile.release.package.stylo]
opt-level = "z"
[profile.release.package.stylo_atoms]
opt-level = "z"
[profile.release.package.stylo_dom]
opt-level = "z"
[profile.release.package.stylo_traits]
opt-level = "z"
[profile.release.package.stylo_taffy]
opt-level = "s"
[profile.release.package.selectors]
opt-level = "z"
[profile.release.package.cssparser]
opt-level = "z"
[profile.release.package.usvg]
opt-level = "z"
[profile.release.package.skrifa]
opt-level = "s"
[profile.release.package."read-fonts"]
opt-level = "s"
[profile.release.package.harfrust]
opt-level = "s"
[profile.release.package.taffy]
opt-level = "s"
[profile.release.package.parley]
opt-level = "s"
[profile.release.package.parley_engine]
opt-level = "s"
[profile.release.package.fontique]
opt-level = "z"
[profile.release.package."blitz-dom"]
opt-level = "s"
[profile.release.package."blitz-html"]
opt-level = "s"
[profile.release.package."blitz-paint"]
opt-level = "s"
[profile.release.package.anyrender]
opt-level = "s"
[profile.release.package.anyrender_svg]
opt-level = "z"
[profile.release.package.anyrender_vello_cpu]
opt-level = "s"
[profile.release.package.vello_common]
opt-level = "s"
[profile.release.package.vello_cpu]
opt-level = "s"
[profile.release.package.image]
opt-level = "z"
[profile.release.package."image-webp"]
opt-level = "z"
[profile.release.package."zune-jpeg"]
opt-level = "z"
[profile.release.package.icu_segmenter]
opt-level = "z"
[profile.release.package.icu_properties]
opt-level = "z"
[profile.release.package.icu_normalizer]
opt-level = "z"
[profile.release.package.icu_collections]
opt-level = "z"
[profile.release.package.icu_locale_core]
opt-level = "z"
[profile.release.package.icu_provider]
opt-level = "z"
